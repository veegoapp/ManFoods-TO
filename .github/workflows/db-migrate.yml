name: Run DB Migration
on:
  workflow_dispatch: {}
permissions:
  contents: read

jobs:
  migrate:
    # Runs against the production database: only ever from main, never from an arbitrary branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '9.0.x'
    - name: Run scripts/migrate.sql against the database
      env:
        SQLSERVER_CONNECTION_STRING: ${{ secrets.SQLSERVER_CONNECTION_STRING }}
      run: bash scripts/db-update.sh
